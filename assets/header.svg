<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Cristian Bastidas — Backend Developer">
  <style>
    :root { --bg1:#f6f8fa; --bg2:#e6fffb; --fg:#0d1117; --muted:#57606a; --accent:#0f9488; --grid:#d0d7de; --panel:#ffffff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg1:#0d1117; --bg2:#0b2a2a; --fg:#e6edf3; --muted:#8b949e; --accent:#2dd4bf; --grid:#21262d; --panel:#161b22; }
    }
    .bg1 { stop-color: var(--bg1); } .bg2 { stop-color: var(--bg2); }
    .name { font: 700 52px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: var(--fg); }
    .role { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: var(--accent); letter-spacing: 1px; }
    .tag  { font: 400 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: var(--muted); }
    .mono { font: 500 15px 'Cascadia Code', Consolas, 'Courier New', monospace; fill: var(--muted); }
    .monoA { font: 600 15px 'Cascadia Code', Consolas, 'Courier New', monospace; fill: var(--accent); }
    .grid { stroke: var(--grid); stroke-width: 1; }
    .panel { fill: var(--panel); stroke: var(--grid); }
    .accent { fill: var(--accent); }
    .cursor { fill: var(--accent); animation: blink 1.1s steps(1) infinite; }
    .pulse { fill: var(--accent); animation: pulse 2.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg1"/><stop offset="1" class="bg2"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" class="grid" fill="none"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#g)"/>
  <rect width="1200" height="260" rx="18" fill="url(#dots)" opacity=".7"/>
  <rect x="0" y="0" width="8" height="260" rx="4" class="accent"/>

  <text x="64" y="104" class="name">Cristian Bastidas</text>
  <text x="66" y="146" class="role">BACKEND · FULL STACK · CLOUD</text>
  <text x="66" y="186" class="tag">I build APIs, microservices and the infrastructure that runs them.</text>
  <text x="66" y="214" class="tag">Based in Colombia</text>

  <!-- mini terminal -->
  <g transform="translate(780,48)">
    <rect width="356" height="164" rx="12" class="panel"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f56"/><circle cx="40" cy="20" r="5" fill="#ffbd2e"/><circle cx="58" cy="20" r="5" fill="#27c93f"/>
    <text x="20" y="62" class="monoA">$</text><text x="38" y="62" class="mono">whoami</text>
    <text x="20" y="88" class="mono">backend-dev @ colombia</text>
    <text x="20" y="114" class="monoA">$</text><text x="38" y="114" class="mono">stack --main</text>
    <text x="20" y="140" class="mono">java · spring · go · postgres</text>
    <rect x="290" y="128" width="9" height="16" class="cursor"/>
  </g>
  <circle cx="1150" cy="232" r="5" class="pulse"/>
</svg>
