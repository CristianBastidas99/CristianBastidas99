name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#14B8A6&color_dots=#ebedf0,#99f6e4,#2dd4bf,#14b8a6,#0f766e
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2DD4BF&color_dots=#161b22,#134e4a,#0f766e,#14b8a6,#2dd4bf

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
