<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="692" viewBox="0 0 1200 692" role="img" aria-label="Diagramas de arquitectura: uniMotor, API gateway, compilador y TaskManager">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Cascadia Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #c9d1d9; font-size: 14px; }
    .title { font-size: 13px; fill: #8b949e; }
    .fig { font-size: 14px; fill: #6e7681; }
    .a { fill: #2dd4bf; }
    .cap { font-size: 12px; fill: #6e7681; }
    .s { font-size: 11px; fill: #8b949e; }
    .panel { fill: none; stroke: #21262d; }
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .dash { fill: none; stroke: #6e7681; stroke-dasharray: 4 4; }
    .flow { fill: none; stroke: #2dd4bf; stroke-width: 1.4; stroke-dasharray: 6 5; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -11; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>

  <rect x="1" y="1" width="1198" height="690" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h1174 a12 12 0 0 1 12 12 v24 h-1198 z" fill="#161b22"/>
  <line x1="1" y1="37" x2="1199" y2="37" stroke="#30363d"/>
  <text x="600" y="24" text-anchor="middle" class="title">cristian@colombia: ~/perfil/arquitectura</text>

  <!-- 1 · uniMotor -->
  <rect x="24" y="64" width="564" height="300" rx="6" class="panel"/>
  <text x="40" y="88" class="fig">// 1 · <tspan class="a">uniMotor</tspan></text>
  <rect x="50" y="118" width="150" height="46" rx="4" class="box"/><text x="125" y="139" text-anchor="middle">Web</text><text x="125" y="155" text-anchor="middle" class="s">JSF · PrimeFaces</text>
  <rect x="50" y="188" width="150" height="46" rx="4" class="box"/><text x="125" y="209" text-anchor="middle">Admin</text><text x="125" y="225" text-anchor="middle" class="s">JavaFX</text>
  <rect x="50" y="258" width="150" height="46" rx="4" class="box"/><text x="125" y="279" text-anchor="middle">API</text><text x="125" y="295" text-anchor="middle" class="s">REST</text>
  <rect x="270" y="188" width="140" height="46" rx="4" class="box"/><text x="340" y="209" text-anchor="middle">Negocio</text><text x="340" y="225" text-anchor="middle" class="s">EJB · JPA</text>
  <g class="box"><path d="M460 196 v30 a50 9 0 0 0 100 0 v-30"/><ellipse cx="510" cy="196" rx="50" ry="9"/></g>
  <text x="510" y="224" text-anchor="middle">MySQL</text>
  <path d="M200 141 C240 141 230 205 268 208" class="flow" marker-end="url(#ar)"/>
  <path d="M200 211 H268" class="flow" marker-end="url(#ar)"/>
  <path d="M200 281 C240 281 230 217 268 214" class="flow" marker-end="url(#ar)"/>
  <path d="M410 211 H458" class="flow" marker-end="url(#ar)"/>
  <text x="40" y="348" class="cap"># compra y venta de vehículos · tres clientes, un núcleo EJB</text>

  <!-- 2 · API gateway -->
  <rect x="612" y="64" width="564" height="300" rx="6" class="panel"/>
  <text x="628" y="88" class="fig">// 2 · <tspan class="a">apiGetwayTrue</tspan></text>
  <rect x="636" y="188" width="100" height="46" rx="4" class="box"/><text x="686" y="216" text-anchor="middle">Cliente</text>
  <rect x="770" y="136" width="384" height="150" rx="6" class="dash"/><text x="782" y="156" class="s">docker</text>
  <rect x="790" y="188" width="150" height="46" rx="4" class="box"/><text x="865" y="209" text-anchor="middle">Gateway</text><text x="865" y="225" text-anchor="middle" class="s">Go</text>
  <rect x="990" y="188" width="150" height="46" rx="4" class="box"/><text x="1065" y="209" text-anchor="middle">Perfiles</text><text x="1065" y="225" text-anchor="middle" class="s">microservicio</text>
  <path d="M736 211 H788" class="flow" marker-end="url(#ar)"/>
  <path d="M940 211 H988" class="flow" marker-end="url(#ar)"/>
  <text x="628" y="348" class="cap"># un punto de entrada que enruta hacia el microservicio</text>

  <!-- 3 · Compilador -->
  <rect x="24" y="376" width="564" height="300" rx="6" class="panel"/>
  <text x="40" y="400" class="fig">// 3 · <tspan class="a">compilador en Kotlin</tspan></text>
  <rect x="44" y="450" width="100" height="46" rx="4" class="box"/><text x="94" y="478" text-anchor="middle">fuente</text>
  <rect x="174" y="450" width="100" height="46" rx="4" class="box"/><text x="224" y="478" text-anchor="middle">léxico</text>
  <rect x="304" y="450" width="100" height="46" rx="4" class="box"/><text x="354" y="478" text-anchor="middle">sintáctico</text>
  <rect x="434" y="450" width="110" height="46" rx="4" class="box"/><text x="489" y="478" text-anchor="middle">semántico</text>
  <rect x="304" y="560" width="240" height="46" rx="4" class="box"/><text x="424" y="588" text-anchor="middle">tabla de símbolos</text>
  <path d="M144 473 H172" class="flow" marker-end="url(#ar)"/>
  <path d="M274 473 H302" class="flow" marker-end="url(#ar)"/>
  <path d="M404 473 H432" class="flow" marker-end="url(#ar)"/>
  <path d="M354 496 V558 M489 496 V558" class="dash"/>
  <text x="40" y="660" class="cap"># del código fuente al análisis semántico, con interfaz JavaFX</text>

  <!-- 4 · TaskManager -->
  <rect x="612" y="376" width="564" height="300" rx="6" class="panel"/>
  <text x="628" y="400" class="fig">// 4 · <tspan class="a">TaskManager</tspan></text>
  <rect x="650" y="480" width="170" height="56" rx="4" class="box"/><text x="735" y="505" text-anchor="middle">App Flutter</text><text x="735" y="523" text-anchor="middle" class="s">funciona sin conexión</text>
  <g class="box"><path d="M990 492 v34 a70 10 0 0 0 140 0 v-34"/><ellipse cx="1060" cy="492" rx="70" ry="10"/></g>
  <text x="1060" y="522" text-anchor="middle">Firestore</text>
  <path d="M820 508 H988" class="flow" marker-end="url(#ar)"/>
  <text x="904" y="498" text-anchor="middle" class="s">sincroniza</text>
  <text x="628" y="660" class="cap"># actividades diarias en entornos mineros e industriales</text>
</svg>
